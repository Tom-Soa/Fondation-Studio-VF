  <script>
    (function () {
      var F = 1 / 60;
      var tl = gsap.timeline({ paused: true });

      // waterfall-entry at low intensity: one direction (from below), heavier words travel
      // further and settle longer on a power3 long tail; opacity resolves fast, transform lingers.
      function arrive(id, at, travel, settle, fade) {
        tl.fromTo(q(id), { y: travel }, { y: 0, duration: settle, ease: "power3.out" }, at);
        tl.fromTo(q(id), { opacity: 0 }, { opacity: 1, duration: fade, ease: "power1.out" }, at);

      // Scene 1 (0.0-1.4s): catalogue numeral fades in; "la différence" slides up and crossfades in.

      var t0 = 0.12;
      arrive("w1", t0, 46, 0.9, 0.22);
      var t1 = t0 + 0.16;
      arrive("w2", t1, 70, 1.1, 0.24);

      // Scene 2 (1.4-2.6s): "n'est pas la beauté." arrives beneath on its own beat, gaps tightening.
      var t2 = 1.4;
      arrive("w3", t2, 44, 0.8, 0.2);
      var t3 = t2 + 0.12;
      arrive("w4", t3, 40, 0.75, 0.18);
      var t4 = t3 + 0.11;
      arrive("w5", t4, 40, 0.75, 0.18);
      var t5 = t4 + 0.1;
      arrive("w6", t5, 72, 1.0, 0.24); // the accented serif word: heaviest travel, longest settle
      var t6 = t5 + 0.14 - 2 * F;
      arrive("w7", t6, 48, 0.6, 0.14);

      // Scene 3 (2.6-4.0s): held read, completely still. Pad the timeline to the full 4s duration.
      tl.set(q("ground"), { opacity: 1 }, 4.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-la-difference"] = tl;
