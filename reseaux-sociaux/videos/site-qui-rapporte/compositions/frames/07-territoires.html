<template>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..900&family=IBM+Plex+Mono:wght@500&family=Instrument+Serif:ital@1&display=swap">
  <style>
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      container-type: size;
      font-family: "Inter Tight", sans-serif;
      color: #f9f9f7;
    }
    #root .clip {
      position: absolute;
      inset: 0;
    }
    #f07-territoires-ground {
      background: #0f172a;
    }
    #f07-territoires-kicker {
      position: absolute;
      left: 5.5cqw;
      top: 6cqh;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 2.1cqw;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #c2410c;
      will-change: transform, opacity;
    }
    #f07-territoires-rule {
      position: absolute;
      left: 5.5cqw;
      top: 9.6cqh;
      width: 36px;
      height: 2px;
      background: #c2410c;
      transform-origin: left center;
    }
    #f07-territoires-stage {
      position: absolute;
      left: 0;
      top: 11cqh;
      width: 1080px;
      height: 1040px;
      will-change: transform;
    }
    #f07-territoires-svg {
      display: block;
      width: 1080px;
      height: 1040px;
      overflow: visible;
    }
    .f07-territoires-hair {
      fill: none;
      stroke: #282726;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
    .f07-territoires-country {
      fill: #c2410c;
      stroke: #c2410c;
      stroke-width: 0;
      stroke-linejoin: round;
      will-change: opacity;
    }
    /* Suisse and Belgique are small next to France and share its fill, so they
       carry a cream keyline and a drawn ring to read as distinct territories. */
    #f07-territoires-ch,
    #f07-territoires-be {
      stroke: #f9f9f7;
      stroke-linejoin: round;
      paint-order: stroke;
    }
    .f07-territoires-ring {
      fill: none;
      stroke: #f9f9f7;
      stroke-width: 2.5;
      opacity: 0;
    }
    #f07-territoires-dots {
      position: absolute;
      left: 5.5cqw;
      top: 62cqh;
      width: 89cqw;
      display: grid;
      grid-template-columns: 1fr 1fr;
      row-gap: 3.4cqh;
      column-gap: 4cqw;
    }
    .f07-territoires-dot-row {
      display: flex;
      align-items: center;
      gap: 1.6cqw;
      will-change: transform, opacity;
    }
    .f07-territoires-dot {
      width: 1.5cqw;
      height: 1.5cqw;
      background: #c2410c;
      flex: 0 0 auto;
      will-change: transform;
    }
    .f07-territoires-dot-label {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 1.85cqw;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f9f9f7;
      white-space: nowrap;
    }
    #f07-territoires-caption {
      position: absolute;
      left: 5.5cqw;
      top: 74cqh;
      width: 89cqw;
      height: 9cqh;
    }
    .f07-territoires-cap {
      position: absolute;
      left: 0;
      top: 0;
      font-family: "Inter Tight", sans-serif;
      font-weight: 700;
      font-size: 8.4cqw;
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-transform: lowercase;
      color: #f9f9f7;
      white-space: nowrap;
      opacity: 0;
      will-change: transform, opacity, filter;
    }
    .f07-territoires-serif {
      font-family: "Instrument Serif", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 1.08em;
      letter-spacing: -0.01em;
      text-transform: none;
      color: #c2410c;
    }
  </style>

  <div id="root" data-composition-id="07-territoires" data-width="1080" data-height="1920">
    <div id="f07-territoires-ground" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>

    <div id="f07-territoires-content" class="clip" data-start="0" data-duration="10" data-track-index="1">
      <div id="f07-territoires-kicker">ON TRAVAILLE AVEC</div>
      <div id="f07-territoires-rule"></div>

      <div id="f07-territoires-stage">
        <svg id="f07-territoires-svg" viewBox="0 0 1080 1040" preserveAspectRatio="xMidYMid meet">
          <g id="f07-territoires-hairlines" opacity="0"></g>
          <path id="f07-territoires-fr" class="f07-territoires-country" d="" opacity="0"></path>
          <path id="f07-territoires-ch" class="f07-territoires-country" d="" opacity="0"></path>
          <path id="f07-territoires-be" class="f07-territoires-country" d="" opacity="0"></path>
          <circle id="f07-territoires-ring-ch" class="f07-territoires-ring" r="52"></circle>
          <circle id="f07-territoires-ring-be" class="f07-territoires-ring" r="52"></circle>
        </svg>
      </div>

      <div id="f07-territoires-dots">
        <div class="f07-territoires-dot-row" id="f07-territoires-dot-1">
          <span class="f07-territoires-dot"></span>
          <span class="f07-territoires-dot-label">GUADELOUPE</span>
        </div>
        <div class="f07-territoires-dot-row" id="f07-territoires-dot-2">
          <span class="f07-territoires-dot"></span>
          <span class="f07-territoires-dot-label">MARTINIQUE</span>
        </div>
        <div class="f07-territoires-dot-row" id="f07-territoires-dot-3">
          <span class="f07-territoires-dot"></span>
          <span class="f07-territoires-dot-label">RÉUNION</span>
        </div>
        <div class="f07-territoires-dot-row" id="f07-territoires-dot-4">
          <span class="f07-territoires-dot"></span>
          <span class="f07-territoires-dot-label">MAYOTTE</span>
        </div>
      </div>

      <div id="f07-territoires-caption">
        <div class="f07-territoires-cap" id="f07-territoires-cap-1">la <span class="f07-territoires-serif">France</span></div>
        <div class="f07-territoires-cap" id="f07-territoires-cap-2">la <span class="f07-territoires-serif">Suisse</span></div>
        <div class="f07-territoires-cap" id="f07-territoires-cap-3">la <span class="f07-territoires-serif">Belgique</span></div>
        <div class="f07-territoires-cap" id="f07-territoires-cap-4">les <span class="f07-territoires-serif">DOM-TOM</span></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script>
    (function () {
      var root = document.getElementById("root");
      var q = function (sel) { return root.querySelectorAll(sel); };

      /* ── Geography: same mechanics as compositions/world-map.html
         (d3 v7 + topojson-client + world-atlas 110m), re-fitted on
         western Europe. Everything paints into paths that already exist
         in the DOM, so the timeline below is built synchronously and any
         seek is correct once the data has landed. ── */
      var W = 1080, H = 1040;
      var CODES = { fr: "250", ch: "756", be: "056" };

      function paintMap(world) {
        var fc = topojson.feature(world, world.objects.countries);
        var all = fc.features;

        function byCode(code) {
          for (var i = 0; i < all.length; i++) {
            if (String(all[i].id).padStart(3, "0") === code) return all[i];
          }
          return null;
        }

        var fr = byCode(CODES.fr);
        var ch = byCode(CODES.ch);
        var be = byCode(CODES.be);
        if (!fr) return;

        /* The world-atlas "France" feature includes the overseas departments
           (Guyane, Reunion, Antilles), so fitting on it would frame the whole
           globe. Keep only the polygons that fall inside metropolitan France's
           bounding box, and use that as both the fitted focus and the drawn
           shape. Same treatment is unnecessary for CH / BE (no overseas parts). */
        function metroOnly(feature) {
          if (!feature || !feature.geometry) return feature;
          var g = feature.geometry;
          if (g.type !== "MultiPolygon") return feature;
          var kept = [];
          for (var pi = 0; pi < g.coordinates.length; pi++) {
            var poly = g.coordinates[pi];
            var ring = poly[0];
            var inside = true;
            for (var ci = 0; ci < ring.length; ci++) {
              var lon = ring[ci][0], lat = ring[ci][1];
              if (lon < -6 || lon > 10 || lat < 41 || lat > 52) { inside = false; break; }
            }
            if (inside) kept.push(poly);
          }
          if (!kept.length) return feature;
          return {
            type: "Feature",
            id: feature.id,
            properties: feature.properties,
            geometry: { type: "MultiPolygon", coordinates: kept },
          };
        }
        fr = metroOnly(fr);

        /* Fit on the three countries together so Suisse and Belgique are
           inside the frame when they light up, then pull the scale back a
           touch so France still dominates and the neighbours read as
           neighbours rather than as equals. */
        var focus = {
          type: "FeatureCollection",
          features: ch && be ? [fr, ch, be] : [fr],
        };
        var projection = d3.geoConicConformal()
          .parallels([44, 49])
          .rotate([-3, 0])
          .fitExtent([[190, 150], [W - 190, H - 430]], focus);

        var path = d3.geoPath().projection(projection);

        /* Hairline outlines for every other country in view. */
        var hair = document.getElementById("f07-territoires-hairlines");
        for (var i = 0; i < all.length; i++) {
          var f = all[i];
          var code = String(f.id).padStart(3, "0");
          if (code === CODES.fr || code === CODES.ch || code === CODES.be) continue;
          var d = path(f);
          if (!d) continue;
          var el = document.createElementNS("http://www.w3.org/2000/svg", "path");
          el.setAttribute("class", "f07-territoires-hair");
          el.setAttribute("d", d);
          hair.appendChild(el);
        }

        function placeRing(id, feature) {
          var ring = document.getElementById(id);
          if (!ring || !feature) return;
          var c = path.centroid(feature);
          if (!c || isNaN(c[0])) return;
          ring.setAttribute("cx", c[0]);
          ring.setAttribute("cy", c[1]);
        }
        placeRing("f07-territoires-ring-ch", ch);
        placeRing("f07-territoires-ring-be", be);

        document.getElementById("f07-territoires-fr").setAttribute("d", path(fr) || "");
        if (ch) document.getElementById("f07-territoires-ch").setAttribute("d", path(ch) || "");
        if (be) document.getElementById("f07-territoires-be").setAttribute("d", path(be) || "");
      }

      d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
        .then(paintMap)
        .catch(function () { /* empty map rather than a broken one */ });

      /* ── Timeline (built synchronously, registered at parse time) ── */
      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0-1.4s): kicker + rule, then the hairline geography
         arrives at very low contrast so the map reads as a real map. */
      tl.fromTo("#f07-territoires-kicker",
        { opacity: 0, y: -16 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#f07-territoires-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.12);
      tl.fromTo("#f07-territoires-hairlines",
        { opacity: 0 },
        { opacity: 1, duration: 0.9, ease: "power3.out" }, 0.35);
      tl.fromTo("#f07-territoires-stage",
        { scale: 1.02, y: 18 },
        { scale: 1, y: 0, duration: 1.2, ease: "power3.out" }, 0.35);

      /* Scene 2 (1.4-3.2s): France fills fire-orange in one sweep,
         outline thickens, caption "la France" lands, camera eases in. */
      tl.fromTo("#f07-territoires-fr",
        { opacity: 0 },
        { opacity: 1, duration: 0.7, ease: "power3.out" }, 1.4);
      tl.fromTo("#f07-territoires-fr",
        { strokeWidth: 0 },
        { strokeWidth: 3, duration: 0.8, ease: "power3.out" }, 1.5);
      tl.fromTo("#f07-territoires-stage",
        { scale: 1, y: 0 },
        { scale: 1.1, y: -26, duration: 1.5, ease: "power3.out" }, 1.4);
      tl.fromTo("#f07-territoires-cap-1",
        { opacity: 0, y: 44, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, 1.55);

      /* Scene 3 (3.2-4.8s): one continuous camera move back out and a
         touch east; Suisse fills; the caption cuts in place. */
      tl.fromTo("#f07-territoires-stage",
        { scale: 1.1, y: -26, x: 0 },
        { scale: 1.02, y: -10, x: -34, duration: 1.4, ease: "power3.inOut" }, 3.2);
      tl.to("#f07-territoires-cap-1",
        { opacity: 0, y: -34, filter: "blur(8px)", duration: 0.45, ease: "power3.in" }, 3.25);
      tl.fromTo("#f07-territoires-cap-2",
        { opacity: 0, y: 38, filter: "blur(9px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 3.5);
      tl.fromTo("#f07-territoires-ch",
        { opacity: 0 },
        { opacity: 1, duration: 0.55, ease: "power3.out" }, 3.5);
      tl.fromTo("#f07-territoires-ch",
        { strokeWidth: 0 },
        { strokeWidth: 3, duration: 0.6, ease: "power3.out" }, 3.55);
      tl.fromTo("#f07-territoires-ring-ch",
        { opacity: 0, scale: 0.55, transformOrigin: "center center" },
        { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 3.5);

      /* Scene 4 (4.8-6.2s): Belgique fills on its beat, caption swaps. */
      tl.to("#f07-territoires-cap-2",
        { opacity: 0, y: -34, filter: "blur(8px)", duration: 0.45, ease: "power3.in" }, 4.85);
      tl.fromTo("#f07-territoires-cap-3",
        { opacity: 0, y: 38, filter: "blur(9px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 5.05);
      tl.fromTo("#f07-territoires-be",
        { opacity: 0 },
        { opacity: 1, duration: 0.55, ease: "power3.out" }, 5.0);
      tl.fromTo("#f07-territoires-be",
        { strokeWidth: 0 },
        { strokeWidth: 3, duration: 0.6, ease: "power3.out" }, 5.05);
      tl.fromTo("#f07-territoires-ring-be",
        { opacity: 0, scale: 0.55, transformOrigin: "center center" },
        { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 5.0);

      /* Scene 5 (6.2-8.4s): the map group settles into the upper half,
         the four overseas dots pop on in one capped stagger, caption
         swaps to "les DOM-TOM". */
      tl.fromTo("#f07-territoires-stage",
        { scale: 1.02, y: -10, x: -34 },
        { scale: 0.86, y: -96, x: -18, duration: 1.5, ease: "power3.inOut" }, 6.2);
      tl.to("#f07-territoires-cap-3",
        { opacity: 0, y: -34, filter: "blur(8px)", duration: 0.45, ease: "power3.in" }, 6.25);
      tl.fromTo("#f07-territoires-cap-4",
        { opacity: 0, y: 38, filter: "blur(9px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 6.5);
      tl.fromTo(q(".f07-territoires-dot-row"),
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.16 }, 6.65);
      tl.fromTo(q(".f07-territoires-dot"),
        { scale: 0 },
        { scale: 1, duration: 0.5, ease: "power3.out", stagger: 0.16 }, 6.7);

      /* Scene 6 (8.4-10.0s): held read, everything at full fire-orange;
         the camera settles the last few pixels and stops. */
      tl.fromTo("#f07-territoires-stage",
        { scale: 0.86, y: -96, x: -18 },
        { scale: 0.865, y: -100, x: -18, duration: 1.6, ease: "power3.out" }, 8.4);
      tl.to({}, { duration: 0.01 }, 9.99);

      window.__timelines = window.__timelines || {};
      window.__timelines["07-territoires"] = tl;
    })();
  </script>
</template>
