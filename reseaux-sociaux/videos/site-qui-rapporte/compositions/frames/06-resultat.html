      #root {

    <div id="06-resultat-ground" class="clip" data-start="0" data-duration="5" data-track-index="0">
      <div id="06-resultat-kicker">Résultat</div>
      <div id="06-resultat-stack">
        <div class="line" id="06-resultat-l1">des appels.</div>

        <div class="line" id="06-resultat-l3">des <span class="serif">clients</span>.</div>

      <div id="06-resultat-rule"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      (function () {
        var SCENE_DURATION = 5;
        var PULSE = 0.8;
        var BEATS = [PULSE * 1, PULSE * 2, PULSE * 3];

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        window.__timelines["06-resultat"] = tl;

        var k = document.getElementById("06-resultat-kicker");
        var l1 = document.getElementById("06-resultat-l1");
        var l2 = document.getElementById("06-resultat-l2");
        var l3 = document.getElementById("06-resultat-l3");
        var rule = document.getElementById("06-resultat-rule");

        // Scene 1: kicker fades in top-left.
        tl.fromTo(k, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0);

        // Scene 2: "des appels." rise slam, long-tail settle.
        tl.fromTo(
          l1,
          { y: 140, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
          BEATS[0]
        );

        // Scene 3: "des devis." side-snap from the left.
        tl.fromTo(
          l2,
          { x: -300, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.65, ease: "expo.out" },
          BEATS[1]
        );

        // Scene 4: "des clients." rise with a soft blur that resolves sharp; the stack locks.
        tl.fromTo(
          l3,
          { y: 160, opacity: 0, filter: "blur(10px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "power4.out" },
          BEATS[2]
        );
        tl.fromTo(
          rule,
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          BEATS[2] + 0.6
        );

        // Scene 5: held read, still, to the end of the frame.
        tl.set({}, {}, SCENE_DURATION);
      })();
    </script>
